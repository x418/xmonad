resolver: lts-24.53

packages:
- ./

# What stack's nix integration (on by default on NixOS) puts in the shell:
# the cabal file's pkgconfig-depends and c-sources need libxkbcommon and
# pkg-config, and util/gen-keysyms.sh reads libxkbcommon's keysym header
# through pkg-config too.  No X11: nothing here links or builds it.
nix:
  packages:
    - zlib
    - pkg-config
    - libxkbcommon
